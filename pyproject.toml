[project]
name = "jobintel-next"
version = "0.1.0"
description = "Clean-slate Greenhouse ingestion project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.0",
  "lingua-language-detector>=2.1.1",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

discover = [
  "ddgs>=9.0.0",
]

[project.scripts]
jobintel-next = "jobintel_next.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
