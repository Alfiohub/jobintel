[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobintel"
version = "0.1.0"
description = "Job intelligence pipeline"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [{name = "Your Name"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "requests",
  "pyyaml",
  "ddgs",
  "fastapi",
  "uvicorn",
  "httpx",
  "lingua-language-detector>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
ner = [
  "transformers>=4.0.0",
  "datasets>=2.0.0",
  "evaluate>=0.4.0",
  "seqeval>=1.2.2",
  "accelerate>=0.30.0",
  "sentencepiece>=0.2.0",
]

[project.scripts]
jobintel = "jobintel.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
